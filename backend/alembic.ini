# Alembic configuration for Bicycle Calibration Backend

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_locations = %(here)s/alembic/versions
path_separator = os

# Database URL can be overridden by DATABASE_URL environment variable in env.py
sqlalchemy.url = postgresql+psycopg://calibration_user:calibration_dev_password@127.0.0.1:5433/calibration_dev

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
